name: Build macOS aarch64

on:
  push:
    branches: [ v1 ]
  workflow_dispatch:

jobs:
  build-macos-aarch64:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build CLI for aarch64-apple-darwin
        run: |
          cd src-tauri
          cargo build --release --target aarch64-apple-darwin

      - name: Create release archive
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release
          tar -czf phi-recorder-cli-macos-aarch64.tar.gz phi-recorder
          mv phi-recorder-cli-macos-aarch64.tar.gz $GITHUB_WORKSPACE/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phi-recorder-cli-macos-aarch64
          path: phi-recorder-cli-macos-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 30
